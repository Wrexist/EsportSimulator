name: Launch quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Collect required source checks (all failures retained)
        run: npm run release:checks
        env:
          CI_FUZZ_WEEKS: '50'
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: |
            tmp/launch-evidence/
            tmp/launch-fixtures/
            tmp/steam-*-report.*
          if-no-files-found: error
          retention-days: 14

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Production build including worker realm check
        run: npm run build
      - name: Retain web build (not a Windows artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          include-hidden-files: true
          path: |
            .next/
            !.next/cache/**
          if-no-files-found: error
          retention-days: 7

  windows-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Fresh Windows package and release evidence (no publication)
        run: npm run release:verify -- --package
      - name: Retain candidate evidence even when acceptance is missing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-evidence
          path: |
            tmp/launch-evidence/
            tmp/launch-fixtures/
            tmp/steam-*-report.*
          if-no-files-found: error
          retention-days: 14
      - name: Retain package for testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate
          path: dist/*.exe
          if-no-files-found: warn
          retention-days: 14
