# CI/CD Pipeline
# Note: IDE warnings about actions not found are false positives - these resolve correctly in GitHub
name: CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test

    - name: Type Check
      run: npm run type-check
      
    - name: Build
      run: npm run build
      
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: matrix.node-version == '20.x'
      with:
        name: build
        path: .next/
        retention-days: 7

  hardening:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Release Hardening Suite
      run: npm run release:hardening
  
  electron:
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install
      run: npm ci
    - name: Build Next.js
      run: npm run build
    - name: Package Electron
      run: npx electron-builder --win --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload Electron Build
      uses: actions/upload-artifact@v4
      with:
        name: electron-win
        path: dist/*.exe
        retention-days: 14

  performance:
    runs-on: ubuntu-latest
    needs: [build, hardening]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install
      run: npm ci
    - name: Build with analysis
      run: ANALYZE=true npm run build
      continue-on-error: true
    - name: Check bundle size
      run: |
        echo "=== Build Output Size ==="
        du -sh .next/ 2>/dev/null || echo "N/A"
        echo "=== Static Pages ==="
        find .next/server -name '*.html' 2>/dev/null | wc -l || echo "0"
      continue-on-error: true
