name: Deploy Workshop guide to GitHub Pages

# Publishes ONLY the site/ folder (the public Workshop instructions page) to
# GitHub Pages. Internal docs elsewhere in the repo are not exposed.
#
# One-time setup: repo Settings → Pages → Build and deployment →
#   Source: "GitHub Actions". After the first run the page is live at
#   https://wrexist.github.io/EsportSimulator/
#
# Put that URL in Steamworks → Workshop → Additional configuration →
#   "Link to instructions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
